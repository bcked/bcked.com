# Builds the static site from the bcked API (https://api.bcked.com) and deploys it to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Rebuild with fresh API data. Runs "At minute 30 past every 6th hour." (see https://crontab.guru)
    - cron: '30 */6 * * *'
  workflow_dispatch:

concurrency:
  group: 'pages-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Deploy
        # Only deploy from main, pull requests only build.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build
